name: Pruebas del backend DataHorse

on:
  push:
    branches: [pre]
  pull_request:
    branches: [pre]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Ejecutar pruebas de Python
    runs-on: ubuntu-latest

    # Valores FALSOS solo para pruebas. Las pruebas usan mocks:
    # no se conectan a MySQL, Mailjet ni Google.
    env:
      ENVIRONMENT: test
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_NAME: test_database
      SECRET_KEY: clave-falsa-solo-para-pruebas-ci-1234567890
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      CODIGO_SECRET: codigo-falso-solo-para-pruebas-ci
      GOOGLE_CLIENT_ID: cliente-falso.apps.googleusercontent.com
      MAILJET_API_KEY: falso
      MAILJET_SECRET_KEY: falso
      MAILJET_SENDER_EMAIL: ci@example.com
      MAILJET_SENDER_NAME: DataHorse

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov httpx2

      - name: Verificar dependencias
        run: python -m pip check

      - name: Ejecutar pruebas con cobertura
        run: python -m pytest -v --cov=app --cov-report=xml:coverage.xml --cov-report=term

      - name: Guardar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: coverage.xml
          if-no-files-found: ignore
