
name: Pruebas del backend DataHorse

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Ejecutar pruebas de Python
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov httpx2

      - name: Verificar dependencias
        run: python -m pip check

      - name: Ejecutar pruebas
        run: python -m pytest -v

      - name: Generar informe de cobertura
        if: always()
        run: |
          python -m pytest --cov=app --cov-report=xml:coverage.xml
        continue-on-error: true

      - name: Guardar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage.xml
          if-no-files-found: ignore
